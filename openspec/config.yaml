schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  项目文档语言要求：
  后续 OpenSpec 相关的任务规划、proposal、design、spec、tasks、归档说明以及实现过程中的任务描述，默认都使用中文编写，方便项目维护者阅读。
  只有在代码标识符、文件路径、命令、API 名称、既有英文术语或 OpenSpec 固定字段必须保留英文时，才使用英文。

  服务端部署与运维速查：
  - 生产服务器 SSH alias: `aliyun`
  - 生产后端目录: `/opt/huapai-backend/services/backend`
  - systemd 服务: `huapai-backend.service`
  - systemd unit: `/etc/systemd/system/huapai-backend.service`
  - 环境变量文件: `/etc/huapai-backend.env`（含密钥，查看时不要输出 secret/token/uri 明文）
  - 对外 API: `https://www.wangyouk.cn`
  - 对外 WSS: `wss://www.wangyouk.cn/ws`
  - 本地监听端口: `8080`
  - 健康检查:
    - `ssh aliyun 'curl -fsS http://127.0.0.1:8080/healthz'`
    - `curl -fsS https://www.wangyouk.cn/healthz`
  - 部署后端:
    1. 本地先跑回归：`node scripts/run-server-core-checks.mjs && node scripts/run-online-checks.mjs && node scripts/run-backend-checks.mjs`
    2. 同步代码：`rsync -az --delete --exclude node_modules --exclude .env --exclude '*.log' services/backend/ aliyun:/opt/huapai-backend/services/backend/`
    3. 安装并重启：`ssh aliyun 'set -e; cd /opt/huapai-backend/services/backend; npm install --omit=dev; systemctl restart huapai-backend.service; sleep 2; systemctl status huapai-backend.service --no-pager -l | sed -n "1,80p"; curl -fsS http://127.0.0.1:8080/healthz'`
  - 查看状态:
    - `ssh aliyun 'systemctl status huapai-backend.service --no-pager -l'`
  - 查看日志:
    - `ssh aliyun 'journalctl -u huapai-backend.service -n 100 --no-pager'`
    - `ssh aliyun 'journalctl -u huapai-backend.service -f'`
  - 查看公网配置（脱敏）:
    - `ssh aliyun 'grep -E "^(PORT|PUBLIC_API_BASE_URL|PUBLIC_SOCKET_URL|MONGODB_DB)=" /etc/huapai-backend.env'`
  - Nginx 对外监听 `80/443`，后端由 nginx 反代到本机 `8080`。
  - 注意：部署时只同步 `services/backend`，不要覆盖 `/etc/huapai-backend.env`，不要把密钥写入 OpenSpec 或日志输出。

  CMS/后台管理页速查：
  - CMS 不是独立前端应用，而是内嵌在同一个后端 Node 服务中，跟随后端一起部署和重启。
  - 公网入口: `https://www.wangyouk.cn/admin`
  - 服务器本机入口: `http://127.0.0.1:8080/admin`
  - 页面源码: `services/backend/src/admin-page.js`
  - 后台服务源码: `services/backend/src/admin-service.js`
  - 后台路由入口: `services/backend/src/server.js`
  - 管理员数据集合: `adminUsers`
  - 管理员登录和会话规范: `openspec/specs/backend-admin-accounts/spec.md`
  - 数据库管理能力规范: `openspec/specs/backend-database-admin/spec.md`
  - 主要 API:
    - `POST /api/admin/login`
    - `GET /api/admin/me`
    - `POST /api/admin/logout`
    - `GET /api/admin/status`
    - `POST /api/admin/clear`
    - `GET /api/admin/admins`
    - `POST /api/admin/admins`
    - `POST /api/admin/admins/disable`
  - CMS 冒烟检查:
    - `curl -fsS https://www.wangyouk.cn/admin | grep -q '管理员登录'`
    - `ssh aliyun 'curl -fsS http://127.0.0.1:8080/admin | grep -q "管理员登录"'`
  - CMS 本地回归:
    - `node scripts/run-backend-checks.mjs`
  - CMS 日志仍看后端服务日志:
    - `ssh aliyun 'journalctl -u huapai-backend.service -n 100 --no-pager'`
    - `ssh aliyun 'journalctl -u huapai-backend.service -f'`
  - 注意：后台使用管理员账号密码登录并签发会话 token；不要在 OpenSpec、日志或终端输出里记录后台密码、`ADMIN_SESSION_SECRET`、`ADMIN_TOKEN` 或登录返回的 token。

  微信小游戏上传与发布速查：
  - 项目类型: 微信小游戏，`project.config.json` 中 `compileType: game`
  - AppID: `wx487628e952ff200d`
  - 上传依赖: `miniprogram-ci`，由根目录 `package.json` 管理
  - 上传脚本:
    - `scripts/upload.js`
    - `scripts/upload.config.json`
  - 上传私钥:
    - `scripts/private.wx487628e952ff200d.key`
    - 私钥不得输出到 OpenSpec、日志、终端摘要或提交说明中。
  - 推荐上传命令:
    - `/opt/homebrew/Cellar/node@20/20.19.4/bin/node scripts/upload.js`
  - 不推荐直接使用系统默认 Node 25 执行 `npm run upload`；当前环境下 `miniprogram-ci` 会在 Node 25 报 `r.getItem is not a function`。
  - 若需要通过 npm 脚本上传，先确保 `node -v` 是 Node 20 LTS，或临时调整 PATH 后再执行 `npm run upload`。
  - 上传前检查:
    1. 已完成本地回归：`node scripts/run-online-checks.mjs && node scripts/run-server-core-checks.mjs && node scripts/run-backend-checks.mjs`
    2. `project.config.json` 的 AppID 与目标小游戏一致。
    3. 当前机器/IP 已加入微信后台上传白名单。
    4. `scripts/upload.config.json` 的 `version` 和 `desc` 已按本次发布更新。
    5. `project.config.json` 的 `packOptions.ignore` 已排除 OpenSpec、scripts、临时目录等不应进入小游戏包的文件。
  - 上传成功判断:
    - 终端输出 `上传成功`
    - 返回 `subPackageInfo`，其中 `__FULL__` 包大小正常。
  - 上传后仍需在微信后台/开发者工具中确认上传版本，并进行真机/生产房间复测；上传成功不等同于用户已验证修复。
  - 2026-06-30 上传实测:
    - 使用 Node `v20.19.4` 执行 `/opt/homebrew/Cellar/node@20/20.19.4/bin/node scripts/upload.js`
    - 上传版本: `1.0.0`
    - 上传描述: `CI上传`
    - 上传结果: 成功，`__FULL__` 包大小约 `3.12 MB`

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 默认使用中文编写 proposal 内容。
  design:
    - 默认使用中文编写 design 内容。
  specs:
    - 默认使用中文编写需求说明和场景描述；OpenSpec 标题格式和 MUST/SHALL 等规范词可按校验要求保留。
  tasks:
    - 默认使用中文编写任务分组和任务描述。
